name: macOS arm64 PGSO candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - build.zig
      - scripts/pgso/**
      - .github/workflows/pgso-macos-arm64.yml

concurrency:
  group: pgso-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  candidate:
    name: Build and qualify candidate
    runs-on: macos-15
    timeout-minutes: 360
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      FX_SOUND: "0"
      PGSO_OUTPUT: ${{ runner.temp }}/fx-pgso
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require native arm64 host
        run: test "$(uname -m)" = arm64

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: pgso-macos-arm64

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install pinned native tools
        run: |
          brew install llvm@21 tmux
          llvm_bin="$(brew --prefix llvm@21)/bin"
          "$llvm_bin/opt" --version | grep -F "version 21.1.8"
          tmux -V

      - name: Install pinned Hyperfine
        run: |
          archive="$RUNNER_TEMP/hyperfine-v1.20.0-aarch64-apple-darwin.tar.gz"
          curl -fsSL \
            https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine-v1.20.0-aarch64-apple-darwin.tar.gz \
            -o "$archive"
          printf '%s  %s\n' \
            8ee7067016620447c9d2d6234ec9a4680f958b7ad983549b56334668f63075b5 \
            "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          hyperfine_bin="$RUNNER_TEMP/hyperfine-v1.20.0-aarch64-apple-darwin/hyperfine"
          test "$("$hyperfine_bin" --version)" = "hyperfine 1.20.0"
          echo "PGSO_HYPERFINE=$hyperfine_bin" >> "$GITHUB_ENV"

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Test the PGSO driver
        run: python3 -m unittest discover -s scripts/pgso/tests -v

      - name: Run complete Stage 1 gate
        run: |
          python3 -m scripts.pgso all \
            --llvm-bin "$(brew --prefix llvm@21)/bin" \
            --output-dir "$PGSO_OUTPUT" \
            --target aarch64-macos \
            --update-channel stable \
            --bun "$(which bun)" \
            --hyperfine "$PGSO_HYPERFINE" \
            --samples 50

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-pgso-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/fx-pgso
          if-no-files-found: error
          retention-days: 14
