name: Guarded Release Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Repair one live Release or the pinned post-cleanup bridge CDN lane
        required: true
        type: choice
        options:
          - release
          - post-cleanup-bridge
      version:
        description: Exact live tag for release repair; ignored for post-cleanup bridge repair
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stable-publication
  cancel-in-progress: false

jobs:
  repair-release:
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release-repair
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve the authenticated bundle identity
        id: identity
        env:
          RELEASE_BUNDLE_READ_ORIGIN: ${{ vars.RELEASE_BUNDLE_READ_ORIGIN }}
          RELEASE_BUNDLE_READ_TOKEN: ${{ secrets.RELEASE_BUNDLE_READ_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release repair requires one exact strict-SemVer tag"
            exit 1
          fi
          IDENTITY=$(python3 -m scripts.release.publish bundle-identity --tag "$VERSION")
          {
            echo "tag=$(jq -r .tag <<< "$IDENTITY")"
            echo "source_sha=$(jq -r .source_sha <<< "$IDENTITY")"
            echo "epoch=$(jq -r .epoch <<< "$IDENTITY")"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile the exact live Release
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUNDLE_READ_ORIGIN: ${{ vars.RELEASE_BUNDLE_READ_ORIGIN }}
          RELEASE_BUNDLE_READ_TOKEN: ${{ secrets.RELEASE_BUNDLE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m scripts.release.publish reconcile \
            --mode repair \
            --tag "${{ steps.identity.outputs.tag }}" \
            --source-sha "${{ steps.identity.outputs.source_sha }}" \
            --epoch "${{ steps.identity.outputs.epoch }}"

  repair-post-cleanup-bridge:
    if: inputs.mode == 'post-cleanup-bridge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release-repair
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore only the pinned bridge CDN lane
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUNDLE_READ_ORIGIN: ${{ vars.RELEASE_BUNDLE_READ_ORIGIN }}
          RELEASE_BUNDLE_READ_TOKEN: ${{ secrets.RELEASE_BUNDLE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m scripts.release.publish reconcile --mode post-cleanup-bridge
