name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-publication
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    environment: stable-publication
    outputs:
      state: ${{ steps.check.outputs.state }}
      tag: ${{ steps.check.outputs.tag }}
      epoch: ${{ steps.check.outputs.epoch }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve exact publication identity
        id: check
        env:
          RELEASE_BUNDLE_PRIVATE_ORIGIN: ${{ vars.RELEASE_BUNDLE_PRIVATE_ORIGIN }}
          RELEASE_BUNDLE_READ_WRITE_TOKEN: ${{ secrets.RELEASE_BUNDLE_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          EPOCH=$(grep 'pub const release_epoch' src/main.zig | head -1 | sed 's/.*= \([0-9][0-9]*\);/\1/')
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version is not strict SemVer"
            exit 1
          fi
          if ! [[ "$EPOCH" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig release epoch is invalid"
            exit 1
          fi

          TAG="v${VERSION}"
          REMOTE_LINE=$(git ls-remote --refs origin "refs/tags/${TAG}")
          TAG_EXISTS=false
          SOURCE_SHA=$GITHUB_SHA
          if [ -n "$REMOTE_LINE" ]; then
            REMOTE_SHA=${REMOTE_LINE%%[[:space:]]*}
            SOURCE_SHA=$REMOTE_SHA
            TAG_EXISTS=true
          fi

          STATUS_ARGS=(
            --tag "$TAG"
            --source-sha "$SOURCE_SHA"
            --epoch "$EPOCH"
          )
          if [ "$TAG_EXISTS" = true ]; then
            STATUS_ARGS+=(--tag-exists)
          fi
          STATE=$(python3 -m scripts.release.publish bundle-status "${STATUS_ARGS[@]}")
          {
            echo "state=$STATE"
            echo "tag=$TAG"
            echo "epoch=$EPOCH"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Publication state: $STATE ($TAG, epoch $EPOCH, $SOURCE_SHA)"

  build:
    needs: check-version
    if: needs.check-version.outputs.state == 'build'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          tar -czf fx-${{ matrix.name }}.tar.gz -C zig-out/bin fx
          sha256sum fx-${{ matrix.name }}.tar.gz > fx-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fx-${{ matrix.name }}
          path: |
            fx-${{ matrix.name }}.tar.gz
            fx-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  build-macos-arm64:
    needs: check-version
    if: needs.check-version.outputs.state == 'build'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pgso-macos-arm64.yml
    with:
      package_release: true

  publish:
    needs: [check-version, build, build-macos-arm64]
    if: >-
      ${{ always()
          && needs.check-version.result == 'success'
          && needs.check-version.outputs.state != 'legacy-complete'
          && (needs.build.result == 'success' || needs.build.result == 'skipped')
          && (needs.build-macos-arm64.result == 'success' || needs.build-macos-arm64.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    environment: stable-publication
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download freshly built artifacts
        if: needs.check-version.outputs.state == 'build'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fx-*
          merge-multiple: true
          path: release-assets

      - name: Seal and read-verify the private release bundle
        if: needs.check-version.outputs.state == 'build'
        env:
          RELEASE_BUNDLE_PRIVATE_ORIGIN: ${{ vars.RELEASE_BUNDLE_PRIVATE_ORIGIN }}
          RELEASE_BUNDLE_READ_WRITE_TOKEN: ${{ secrets.RELEASE_BUNDLE_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m scripts.release.publish seal \
            --asset-dir release-assets \
            --tag "${{ needs.check-version.outputs.tag }}" \
            --source-sha "${{ needs.check-version.outputs.source_sha }}" \
            --epoch "${{ needs.check-version.outputs.epoch }}"

      - name: Reconcile tag, Release, CDN objects, and pointers
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUNDLE_PRIVATE_ORIGIN: ${{ vars.RELEASE_BUNDLE_PRIVATE_ORIGIN }}
          RELEASE_BUNDLE_READ_WRITE_TOKEN: ${{ secrets.RELEASE_BUNDLE_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m scripts.release.publish reconcile \
            --mode normal \
            --tag "${{ needs.check-version.outputs.tag }}" \
            --source-sha "${{ needs.check-version.outputs.source_sha }}" \
            --epoch "${{ needs.check-version.outputs.epoch }}"
