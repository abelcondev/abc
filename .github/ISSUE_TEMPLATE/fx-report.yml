name: fx bug report
description: Report a problem with fx
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve fx.

        Before submitting, make sure all data is sanitized. Remove API keys, tokens, credentials, private URLs, personal data, sensitive file paths, and any other secrets.

        If you can, include details from the affected session. Replace `$SESSION_ID` with its ID, then run:

        ```sh
        fx ask "summarize $SESSION_ID for a public fx feedback report"
        ```

        Review and redact the generated summary before pasting it below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem, what you expected, and how to reproduce it. Paste only information you have reviewed and sanitized.
      value: |
        <!-- PLEASE PASTE YOUR FEEDBACK HERE -->
        <!-- MAKE SURE TO REDACT SENSITIVE INFO -->
    validations:
      required: true

  - type: textarea
    id: session-summary
    attributes:
      label: Public session summary
      description: Optional. Paste the reviewed and redacted summary generated by the command above.
      placeholder: Paste the public session summary here.
    validations:
      required: false

  - type: checkboxes
    id: sanitized
    attributes:
      label: Sensitive information
      options:
        - label: I reviewed the information above and removed secrets and other sensitive data.
          required: true
