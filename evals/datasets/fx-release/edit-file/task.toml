schema_version = "1.1"

[task]
name = "vercel-labs-fx/edit-file"
description = "Edit an existing JSON config without destroying surrounding fields."
keywords = ["files", "edit", "json"]

[metadata]
category = "filesystem"
difficulty = "easy"

[verifier]
timeout_sec = 30.0
user = "root"

[agent]
timeout_sec = 120.0
user = "agent"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
allow_internet = true
