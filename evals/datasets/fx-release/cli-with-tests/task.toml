schema_version = "1.1"

[task]
name = "vercel-labs-fx/cli-with-tests"
description = "Create a small Node.js CLI tool with passing tests."
keywords = ["node", "cli", "tests"]

[metadata]
category = "coding"
difficulty = "medium"

[verifier]
timeout_sec = 180.0
user = "root"

[agent]
timeout_sec = 360.0
user = "agent"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
allow_internet = true
